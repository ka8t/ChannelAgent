# Secret scanning (#67). Two exact values are allowed because they are not
# secrets: the throwaway key the tests use, and the dummy API key of the CI
# job that starts the image. Allowing the exact values, and not whole files,
# means a real key pasted next to them is still caught.
title = "ChannelAgent gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Values that are not secrets"
regexes = [
  'PmKTledxEc-gdO4tty5QO4PjB48zp_GqWMVIpigdwEg=',
  'ci-key-0123456789abcdef',
]
