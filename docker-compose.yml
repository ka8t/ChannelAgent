# Local development compose file (#19). Production topology (VPS,
# containerized inference backend) is a separate compose file — see
# issue #21, not implemented yet.
services:
  channelagent:
    build: .
    env_file: .env
    environment:
      # Wins over env_file: inside the container the API has to listen on
      # every interface, whatever a native-run value in .env says.
      API_SERVER_HOST: "0.0.0.0"
    ports:
      # Admin API (#22) — only reachable at all once API_SERVER_KEY is
      # set in .env, which also enables it inside app/main.py. Published
      # on loopback only (#52): it serves decrypted conversations behind
      # one static key over plain HTTP. To reach it from another machine
      # set API_BIND_ADDRESS (for example 0.0.0.0) and put TLS in front,
      # see docs/ARCHITECTURE.md.
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_SERVER_PORT:-8700}:${API_SERVER_PORT:-8700}"
    volumes:
      - ./data:/app/data
    # host.docker.internal resolves automatically on Docker Desktop
    # (macOS/Windows); this makes it resolve on Linux Docker Engine too,
    # for parity with a Linux dev machine. See docs/ARCHITECTURE.md.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
