name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -v

  docker-build:
    # A separate job, not a step of lint-and-test: this specifically
    # exists because real bugs were found this way and nowhere else —
    # the Dockerfile once omitted alembic.ini/alembic/ entirely (#11),
    # which no unit test could catch, only an actual image build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t channelagent:ci .
